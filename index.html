<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Calendar</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 10px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 12px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 18px;
}

/* CALENDAR */
.calendar {
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow-y: auto;
    max-height: 75vh;
    position: relative;
}

/* HEADER */
.header-row {
    display: flex;
    background: #eef1f4;
    font-weight: bold;
    font-size: 12px;
    position: sticky;
    top: 0;
    z-index: 3;
}

.time-col {
    width: 60px;
    padding: 6px;
    text-align: center;
    border-right: 1px solid #ddd;
}

.events-col {
    flex: 1;
    padding: 6px;
}

/* ROWS */
.hour-row {
    display: flex;
    border-bottom: 1px solid #eee;
}

.hour-time {
    width: 60px;
    padding: 6px;
    font-size: 11px;
    text-align: center;
    background: #fafafa;
    border-right: 1px solid #eee;
}

.hour-events {
    flex: 1;
    position: relative;
    height: 70px;
    background: #fcfcfc;
}

/* EVENTS */
.event {
    position: absolute;
    color: #fff;
    border-radius: 6px;
    padding: 6px;
    font-size: 10px;
    overflow: hidden;
}

.event1 { background: #7b8cff; }
.event2 { background: #d7a6f5; }
.event3 { background: #7cc4ff; }
.event4 { background: #6fd6a8; }
.event5 { background: #f59ab0; }
.event6 { background: #a8dadc; color:#333; }

.event-title {
    font-weight: bold;
    font-size: 11px;
}

.event-time {
    font-size: 9px;
}

/* NOW LINE */
.now-line {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: #ff4d4f;
    z-index: 5;
}

.now-label {
    position: absolute;
    top: -10px;
    left: 5px;
    font-size: 10px;
    background: #ff4d4f;
    color: white;
    padding: 1px 4px;
    border-radius: 3px;
}

/* MOBILE */
@media (max-width: 600px) {
    .hour-events { height: 60px; }
    .event { font-size: 9px; padding: 4px; }
    .time-col, .hour-time { width: 50px; font-size: 10px; }
}
</style>
</head>

<body>

<div class="container">
    <h1>June 21, 2026 — Schedule</h1>
    <div id="calendar"></div>
    <div id="loading" style="text-align:center;padding:20px;">Loading...</div>
</div>

<script>
const API_KEY = 'AIzaSyCBwA1J8GJnp7KGH7V4C5_XfADcImafJGE';
const CALENDAR_ID = '8b46b07f4367702d95922677ccb42479bd7397ed22f2b9a36f5c48fcce2be538@group.calendar.google.com';
const TARGET_DATE = '2026-06-21';

function formatTime(date) {
    let h = date.getHours();
    const m = String(date.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${m} ${ampm}`;
}

function isOverlapping(e1, e2) {
    const s1 = new Date(e1.start.dateTime);
    const e1e = new Date(e1.end.dateTime);
    const s2 = new Date(e2.start.dateTime);
    const e2e = new Date(e2.end.dateTime);
    return s1 < e2e && e1e > s2;
}

async function loadEvents() {
    const url = `https://www.googleapis.com/calendar/v3/calendars/${CALENDAR_ID}/events?timeMin=${TARGET_DATE}T10:00:00Z&timeMax=${TARGET_DATE}T20:00:00Z&singleEvents=true&orderBy=startTime&key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    renderCalendar(data.items || []);
}

function renderCalendar(events) {
    document.getElementById('loading').style.display = 'none';

    events.forEach((e,i)=>{
        e.isOverlap = events.some((other,j)=> i!==j && isOverlapping(e, other));
    });

    const cal = document.createElement('div');
    cal.className = 'calendar';

    const header = document.createElement('div');
    header.className = 'header-row';
    header.innerHTML = '<div class="time-col">Time</div><div class="events-col">Events</div>';
    cal.appendChild(header);

    for (let h=10; h<20; h++) {
        const row = document.createElement('div');
        row.className = 'hour-row';

        const t = document.createElement('div');
        t.className = 'hour-time';
        t.textContent = formatTime(new Date(2026,5,21,h));

        const ev = document.createElement('div');
        ev.className = 'hour-events';
        ev.id = 'hour-'+h;

        row.appendChild(t);
        row.appendChild(ev);
        cal.appendChild(row);
    }

    document.getElementById('calendar').appendChild(cal);

    events.forEach((event, idx) => {
        const start = new Date(event.start.dateTime);
        const end = new Date(event.end.dateTime);

        const top = (start.getMinutes()/60)*100;
        const height = ((end-start)/(1000*60*60))*100;

        const el = document.createElement('div');
        el.className = `event event${(idx%6)+1}`;

        if (event.isOverlap) {
            el.style.left = '50%';
            el.style.width = '48%';
        } else {
            el.style.left = '1%';
            el.style.width = '48%';
        }

        el.style.top = top + '%';
        el.style.height = height + '%';

        el.innerHTML = `
            <div class="event-title">${event.summary}</div>
            <div class="event-time">${formatTime(start)} - ${formatTime(end)}</div>
        `;

        const container = document.getElementById('hour-'+start.getHours());
        if (container) container.appendChild(el);
    });

    addNowLine();
    setInterval(addNowLine, 60000);

    setTimeout(autoScrollToNow, 200);
}

/* NOW LINE */
function addNowLine() {
    const cal = document.querySelector('.calendar');
    let line = document.getElementById('now-line');

    if (!line) {
        line = document.createElement('div');
        line.id = 'now-line';
        line.className = 'now-line';

        const label = document.createElement('div');
        label.className = 'now-label';
        label.id = 'now-label';

        line.appendChild(label);
        cal.appendChild(line);
    }

    const now = new Date();
    const startHour = 10;
    const endHour = 20;

    if (now.getHours() < startHour || now.getHours() >= endHour) {
        line.style.display = 'none';
        return;
    }

    line.style.display = 'block';

    const minutes = (now.getHours()-startHour)*60 + now.getMinutes();
    const percent = (minutes / ((endHour-startHour)*60)) * 100;

    line.style.top = percent + '%';
    document.getElementById('now-label').textContent = formatTime(now);
}

/* AUTO SCROLL */
function autoScrollToNow() {
    const cal = document.querySelector('.calendar');
    const line = document.getElementById('now-line');
    if (!line) return;

    const now = new Date();
    if (now.getHours() < 10 || now.getHours() >= 20) return;

    const offsetTop = line.offsetTop;
    const scrollTarget = offsetTop - (cal.clientHeight / 2);

    cal.scrollTo({
        top: scrollTarget,
        behavior: 'smooth'
    });
}

loadEvents();
</script>

</body>
</html>
